name: SIS seat monitor

on:
  schedule:
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sis-seat-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore notification state
        id: restore-state
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .data/state.json
          key: sis-state-${{ github.run_id }}
          restore-keys: |
            sis-state-

      - name: Check seats
        id: check
        env:
          SIS_USERNAME: ${{ secrets.SIS_USERNAME }}
          SIS_PASSWORD: ${{ secrets.SIS_PASSWORD }}
          WXPUSHER_SPT: ${{ secrets.WXPUSHER_SPT }}
          BROWSER_PATH: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
          HEADLESS: "true"
        run: node webvpn-monitor.mjs once

      - name: Save changed notification state
        if: steps.check.outputs.state_changed == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .data/state.json
          key: sis-state-${{ github.run_id }}
